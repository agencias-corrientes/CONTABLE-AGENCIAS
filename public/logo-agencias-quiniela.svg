    <linearGradient id="maroon" x1="0" y1="0" x2=".9" y2="1"><stop offset="0" stop-color="#a52c43"/><stop offset=".48" stop-color="#762036"/><stop offset="1" stop-color="#4f142b"/></linearGradient>
    <radialGradient id="navy" cx=".32" cy=".2" r=".9"><stop offset="0" stop-color="#174e9a"/><stop offset=".65" stop-color="#082d6c"/><stop offset="1" stop-color="#061c48"/></radialGradient>
    <radialGradient id="redBall" cx=".3" cy=".2" r=".85"><stop offset="0" stop-color="#ff8b87"/><stop offset=".28" stop-color="#e72a37"/><stop offset=".75" stop-color="#a50d28"/><stop offset="1" stop-color="#65091c"/></radialGradient>
