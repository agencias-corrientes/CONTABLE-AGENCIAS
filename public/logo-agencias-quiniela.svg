<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Agencias de Quiniela Corrientes</title>
  <desc id="logoDesc">Emblema circular bordó, azul y dorado con un ticket y bolas de quiniela.</desc>
  <defs>
