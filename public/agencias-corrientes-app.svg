  <defs>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe72e"/><stop offset=".56" stop-color="#ffd916"/><stop offset="1" stop-color="#f0b900"/></linearGradient>
